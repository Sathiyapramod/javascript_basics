<script>
    console.log("start")
    setTimeout(() => {
        console.log("one second timer")
    }, 1000)

    setTimeout(() =>
        console.log("zero second timer")
        , 0)
    const a = new Promise((resolve, reject) => {
        if (2 < 3) resolve("2 is greater than 3")
        else reject("invalid reason to reject")
    })

    a.then((response) => console.log(response)).catch((err) => console.log("err"))

    setTimeout(() => {
        console.log("2 second timer")
    }, 2000)

    console.log("stop")


</script>
