<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            #myInput {
                width: 300px;
                padding: 10px;
                border-radius: 8px;
                border: 1px solid #a1a1a1;
                margin-bottom: 10px;
            }
            #submitBtn {
                border-radius: 8px;
                border: none;
                background-color: cornflowerblue;
                color: white;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <div>
            <!-- input box -->
            <input
                type="text"
                id="myInput"
                placeholder="Enter three words separated by commas"
            />
            <br />
            <br />
            <!-- button to click -->
            <button type="button" id="submitBtn">Submit</button>
        </div>
    </body>
    <script src="./script.js"></script>
</html>
